schema_version = 1
id = "opencode"
label = "OpenCode"
description = "OpenCode CLI"
icon = "OC"
is_tui = true

[launch.tui.windows]
command = "opencode"
args = []
powershell_shim = true

[launch.tui.macos]
command = "opencode"
args = []

[launch.tui.linux]
command = "opencode"
args = []

[[attention]]
pattern = "(?i)enter submit"
means = "needs_approval"

[[attention]]
pattern = "(?i)esc dismiss"
means = "needs_approval"

[[attention]]
pattern = "(?i)↑↓ select"
means = "needs_approval"

[[attention]]
pattern = "(?i)\\d+\\.\\s*yes\\b"
means = "needs_approval"

[[attention]]
pattern = "(?i)\\d+\\.\\s*no\\b"
means = "needs_approval"

[[attention]]
pattern = "(?i)type your own answer"
means = "needs_approval"
