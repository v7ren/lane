schema_version = 1
id = "claude"
label = "Claude Code"
description = "Anthropic Claude Code CLI"
icon = "CC"
is_tui = true

[launch.tui.windows]
command = "claude"
args = []
powershell_shim = true

[launch.tui.macos]
command = "claude"
args = []

[launch.tui.linux]
command = "claude"
args = []

[launch.server]
args = [
  "-p",
  "--input-format",
  "stream-json",
  "--output-format",
  "stream-json",
  "--include-partial-messages",
  "--verbose",
  "--session-id",
  "{session_id}",
  "--permission-mode",
  "default",
]
protocol = "claude-stream-json"
ready = { kind = "stdout_regex", path = ".", timeout_ms = 60000 }

[launch.resume]
args = ["--resume", "{session_id}"]
